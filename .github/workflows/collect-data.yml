# PortföyAI bulut veri toplayıcı (fiyat + kur + haber + AI analizi).
# 20 dakikada bir çalışır (PC kapalıyken de). Fırsat adayları AYRI ve seyrek
# (6 saat) koşar — bkz. collect-candidates.yml.
# Gerekli secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   ANTHROPIC_API_KEY (opsiyonel — AI haber analizi için; yoksa analiz atlanır)
name: Veri Toplayici

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # Actions sekmesinden elle de tetiklenebilir

jobs:
  collect:
    runs-on: ubuntu-latest
    # 15 dk: AI açıkken tur ~1 dk'dan uzun sürüyor (Haiku çağrıları hesabın hız
    # limitine takılabiliyor). 20 dk'lık cron ile çakışmaması için 15'i geçmemeli;
    # collect.js'teki AI_DEADLINE (8 dk) turun buraya dayanmasını zaten engeller.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Tüm projeyi değil, yalnızca toplayıcının ihtiyacı olan paketleri kur (hız + dakika tasarrufu)
      - name: Bağımlılık kur
        run: npm install yahoo-finance2 @anthropic-ai/sdk --no-save --no-audit --no-fund

      - name: Veri topla ve Supabase'e yaz
        run: node server/collect.js
        env:
          COLLECT_MODE: data
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
