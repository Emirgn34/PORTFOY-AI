# PortföyAI hızlı tur: fiyat + kur + taze haber + OLAY NÖBETİ.
# 20 dakikada bir çalışır (PC kapalıyken de). Ağır iş (evren taraması, 2 yıllık
# grafik, temel veriler) AYRI ve seyrek koşar — bkz. collect-candidates.yml.
#
# Olay nöbeti bu turun asıl işi: vitrindeki adayların kanıtı TAZE haberle
# yeniden değerlendirilir. Böylece bir açıklama/anlaşma 6 saat sonra değil
# ~20 dakika içinde yakalanır.
#
# AI MALİYETİ SIFIRA YAKIN: Haber duygu/güvenilirliği kural motorundan gelir
# (server/newsHeuristics.js, ücretsiz). Haiku yalnızca YENİ bir kanıt vitrine
# çıktığında ve olay başına BİR KEZ çağrılır (aynı olay için ikinci kez ödeme
# yapılmaz — bkz. eventWatch.js evidenceSignature). Sakin turlarda hiç çağrı olmaz.
#
# Gerekli secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   ANTHROPIC_API_KEY (opsiyonel — yoksa kanıt yine bulunur, yalnızca AI'ın
#                      yazdığı gerekçe cümlesi olmaz)
name: Veri Toplayici

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # Actions sekmesinden elle de tetiklenebilir

jobs:
  collect:
    runs-on: ubuntu-latest
    # Tur ağ hızıyla sınırlı (~2-3 dk): haber çekimi dönüşümlü, AI çağrısı en
    # fazla bir tane. 20 dk'lık cron ile çakışmaması için 12 dk'da kesilir.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Tüm projeyi değil, yalnızca toplayıcının ihtiyacı olan paketleri kur (hız + dakika tasarrufu)
      - name: Bağımlılık kur
        run: npm install yahoo-finance2 @anthropic-ai/sdk --no-save --no-audit --no-fund

      - name: Veri topla, olay nöbetini çalıştır ve Supabase'e yaz
        run: node server/collect.js
        env:
          COLLECT_MODE: data
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
