name: Kod Kalitesi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund
      - name: Birim testleri (sunucu + skor motoru)
        run: npm run test:unit
      - name: Arayüz testleri (production kod yolu)
        run: npm run test:ui
      - name: Production build
        run: npm run build
      - name: Kalkan TypeScript denetimi
        run: npx tsc -p tsconfig.hedge.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kalkan algoritma testleri
        run: python -m unittest discover -s test -p 'test_hedge*.py'
